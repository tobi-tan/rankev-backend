# Render.com Blueprint — one-click deploy of API + managed Postgres.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: rankev-db
    databaseName: rankev
    user: rankev_app
    plan: free

services:
  - type: web
    name: rankev-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rankev-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: CORS_ORIGIN
        value: ""
